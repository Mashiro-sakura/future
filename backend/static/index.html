<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>期现分析</title>
    <style>
      :root {
        color: #182033;
        background: #f6f7fb;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7fb;
      }

      .app {
        width: min(100%, 430px);
        min-height: 100vh;
        margin: 0 auto;
        background: #f6f7fb;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        min-height: 132px;
        padding: 24px 20px;
        background: #0f172a;
        color: #fff;
      }

      .eyebrow {
        margin: 0 0 6px;
        color: #93c5fd;
        font-size: 13px;
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      .refresh {
        width: 68px;
        height: 36px;
        border: 0;
        border-radius: 8px;
        background: #f97316;
        color: #fff;
        font-weight: 700;
      }

      main {
        display: grid;
        gap: 14px;
        padding: 14px;
      }

      .panel {
        border: 1px solid #e5e7eb;
        border-radius: 8px;
        background: #fff;
      }

      .report {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 16px;
      }

      .report h2 {
        margin: 0;
        overflow: hidden;
        color: #111827;
        font-size: 17px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .report p {
        margin: 6px 0 0;
        color: #64748b;
        font-size: 13px;
      }

      .link {
        flex: 0 0 auto;
        color: #2563eb;
        font-size: 13px;
        font-weight: 700;
      }

      .product-list {
        display: grid;
        gap: 12px;
      }

      .product {
        padding: 16px;
      }

      .product.active {
        border-color: #2563eb;
        box-shadow: 0 0 0 1px #2563eb inset;
      }

      .product-head,
      .price-row,
      .advice-head {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .code {
        margin: 0;
        color: #111827;
        font-size: 24px;
        font-weight: 800;
      }

      .name {
        margin: 2px 0 0;
        color: #64748b;
        font-size: 12px;
      }

      .main-contract {
        color: #2563eb;
        font-weight: 700;
      }

      .advice {
        min-width: 76px;
        padding: 6px 8px;
        border-radius: 7px;
        background: #ecfdf5;
        color: #047857;
        font-size: 13px;
        font-weight: 700;
        text-align: center;
      }

      .price-row {
        margin-top: 16px;
      }

      .label {
        display: block;
        color: #64748b;
        font-size: 12px;
      }

      .value {
        display: block;
        margin-top: 5px;
        color: #111827;
        font-size: 21px;
        font-weight: 800;
      }

      .change {
        display: block;
        margin-top: 2px;
        color: #64748b;
        font-size: 12px;
      }

      .positive {
        color: #c2410c;
      }

      .negative {
        color: #0f766e;
      }

      .basis-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 14px;
      }

      .basis-row span {
        padding: 5px 8px;
        border-radius: 7px;
        background: #f1f5f9;
        color: #475569;
        font-size: 12px;
      }

      .chart-panel,
      .summary,
      .analysis,
      .recommendations {
        padding: 16px;
      }

      .section-title {
        margin: 0 0 12px;
        color: #111827;
        font-size: 17px;
      }

      uni-canvas {
        width: 100%;
        height: 210px;
      }

      .summary-text {
        margin: 0;
        color: #334155;
        font-size: 14px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .analysis-grid {
        display: grid;
        gap: 12px;
      }

      .analysis-item {
        padding: 12px;
        border-radius: 8px;
        background: #f8fafc;
      }

      .analysis-item h3 {
        margin: 0 0 8px;
        color: #1d4ed8;
        font-size: 15px;
      }

      .conclusion-text {
        color: #dc2626;
        font-size: 15px;
        font-weight: 900;
      }

      .recommendation {
        padding: 14px 0;
        border-top: 1px solid #e5e7eb;
      }

      .recommendation:first-of-type {
        border-top: 0;
        padding-top: 0;
      }

      .recommendation h3 {
        margin: 0;
        color: #111827;
        font-size: 18px;
      }

      .recommendation .action {
        padding: 5px 8px;
        border-radius: 7px;
        background: #eff6ff;
        color: #1d4ed8;
        font-size: 13px;
        font-weight: 700;
      }

      .recommendation p {
        margin: 10px 0 0;
        color: #334155;
        font-size: 14px;
        line-height: 1.55;
      }

      .risk {
        color: #b45309 !important;
      }

      .bar {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
        color: #64748b;
        font-size: 12px;
      }

      .track {
        flex: 1;
        height: 7px;
        overflow: hidden;
        border-radius: 999px;
        background: #e5e7eb;
      }

      .fill {
        height: 100%;
        border-radius: 999px;
        background: #f97316;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-BcdTzHAR.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="eyebrow" id="sessionText">日报</p>
          <h1>期现采购建议</h1>
        </div>
        <button class="refresh" id="refreshBtn">刷新</button>
      </header>
      <main>
        <section class="report panel" id="reportCard"></section>
        <section class="product-list" id="productList"></section>
        <section class="chart-panel panel">
          <h2 class="section-title" id="chartTitle">PTA 期现价格</h2>
          <canvas id="trendChart" width="760" height="420"></canvas>
        </section>
        <section class="analysis panel">
          <h2 class="section-title">四维分析</h2>
          <div class="analysis-grid" id="analysisGrid"></div>
        </section>
        <section class="recommendations panel">
          <h2 class="section-title">采购建议</h2>
          <div id="recommendations"></div>
        </section>
        <section class="summary panel">
          <h2 class="section-title">行情摘要</h2>
          <p class="summary-text" id="summaryText"></p>
        </section>
      </main>
    </div>

  </body>
</html>
