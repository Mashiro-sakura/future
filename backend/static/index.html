<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>期现分析</title>
    <style>
      :root {
        color: #e6eaf2;
        background: #0b0e17;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0b0e17;
      }

      .app {
        width: min(100%, 430px);
        min-height: 100vh;
        margin: 0 auto;
        background: #0b0e17;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid #1f2637;
        background: #0d1322;
        color: #e6eaf2;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #7ea8f0;
        font-size: 12px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .refresh {
        width: 60px;
        height: 32px;
        border: 1px solid #4f8ff7;
        border-radius: 5px;
        background: transparent;
        color: #4f8ff7;
        font-size: 12px;
        font-weight: 700;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 12px;
      }

      .panel {
        border: 1px solid #1f2637;
        border-radius: 6px;
        background: #131826;
      }

      .report {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
      }

      .report h2 {
        margin: 0;
        overflow: hidden;
        color: #e6eaf2;
        font-size: 16px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .report p {
        margin: 5px 0 0;
        color: #5d6779;
        font-size: 12px;
      }

      .link {
        flex: 0 0 auto;
        color: #4f8ff7;
        font-size: 12px;
        font-weight: 700;
      }

      .product-list {
        display: grid;
        gap: 10px;
      }

      .product {
        padding: 14px 16px;
      }

      .product.active {
        border-color: #4f8ff7;
        box-shadow: 0 0 0 1px #4f8ff7 inset;
      }

      .product-head,
      .price-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .code {
        display: inline-block;
        margin: 0;
        color: #e6eaf2;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .name {
        margin: 2px 0 0;
        color: #5d6779;
        font-size: 12px;
      }

      .main-contract {
        color: #7ea8f0;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      .price-row {
        margin-top: 14px;
      }

      .label {
        display: block;
        color: #5d6779;
        font-size: 11px;
      }

      .value {
        display: block;
        margin-top: 4px;
        color: #e6eaf2;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .change {
        display: block;
        margin-top: 2px;
        color: #7d879c;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .positive {
        color: #f0455c;
      }

      .negative {
        color: #0dbf7e;
      }

      .basis-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .basis-row span {
        padding: 4px 9px;
        border: 1px solid #232b3d;
        border-radius: 4px;
        background: #1a2130;
        color: #a7b0c2;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .chart-panel,
      .summary,
      .analysis {
        padding: 14px 16px;
      }

      .section-title {
        margin: 0 0 10px;
        color: #e6eaf2;
        font-size: 15px;
        font-weight: 600;
      }

      uni-canvas {
        width: 100%;
        height: 210px;
      }

      .summary-text {
        margin: 0;
        color: #c3cad9;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .analysis-grid {
        display: grid;
        gap: 10px;
      }

      .analysis-item {
        padding: 12px;
        border: 1px solid #1f2637;
        border-radius: 5px;
        background: #161d2c;
      }

      .analysis-item h3 {
        margin: 0 0 7px;
        color: #4f8ff7;
        font-size: 13px;
      }

      .conclusion-text {
        color: #f0455c;
        font-weight: 700;
      }

      .disclaimer {
        margin: 0;
        padding: 4px 0 14px;
        color: #5d6779;
        font-size: 11px;
        text-align: center;
      }
    </style>
    <script type="module" crossorigin src="/assets/index-8vXKfqzi.js"></script>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="eyebrow" id="sessionText">日报</p>
          <h1>期现分析</h1>
        </div>
        <button class="refresh" id="refreshBtn">刷新</button>
      </header>
      <main>
        <section class="report panel" id="reportCard"></section>
        <section class="product-list" id="productList"></section>
        <section class="chart-panel panel">
          <h2 class="section-title" id="chartTitle">PTA 期现价格</h2>
          <canvas id="trendChart" width="760" height="420"></canvas>
        </section>
        <section class="analysis panel">
          <h2 class="section-title">四维分析</h2>
          <div class="analysis-grid" id="analysisGrid"></div>
        </section>
        <section class="summary panel">
          <h2 class="section-title">行情摘要</h2>
          <p class="summary-text" id="summaryText"></p>
        </section>
        <p class="disclaimer">结构描述，非买卖指令</p>
      </main>
    </div>

  </body>
</html>
