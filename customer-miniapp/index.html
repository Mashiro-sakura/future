<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>期现分析</title>
    <style>
      :root {
        --bg: #0a0d15;
        --panel: #111627;
        --panel-2: #161c30;
        --line: #1f2637;
        --line-soft: #1a2133;
        --text: #e6eaf2;
        --text-2: #a7b0c2;
        --muted: #5d6779;
        --accent: #4f8ff7;
        --accent-dim: #7ea8f0;
        --up: #f0455c;
        --down: #0dbf7e;
        --warn: #d9a53f;
        color: var(--text);
        background: var(--bg);
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      * { box-sizing: border-box; }
      body { margin: 0; background: var(--bg); }
      .num { font-variant-numeric: tabular-nums; }

      .app {
        width: min(100%, 430px);
        min-height: 100vh;
        margin: 0 auto;
        background: var(--bg);
        border-left: 1px solid var(--line-soft);
        border-right: 1px solid var(--line-soft);
      }

      /* ── 顶栏 ─────────────────────── */
      .topbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        height: 52px;
        padding: 0 14px;
        border-bottom: 1px solid var(--line);
        background: #0d1220;
      }
      .topbar .brand {
        display: flex;
        align-items: baseline;
        gap: 8px;
      }
      .topbar h1 {
        margin: 0;
        font-size: 16px;
        font-weight: 700;
        letter-spacing: 2px;
      }
      .topbar .session {
        color: var(--accent-dim);
        font-size: 11px;
      }
      .refresh {
        height: 28px;
        padding: 0 12px;
        border: 1px solid var(--accent);
        border-radius: 4px;
        background: transparent;
        color: var(--accent);
        font-size: 11px;
        font-weight: 700;
        cursor: pointer;
      }

      /* ── Ticker 条 ─────────────────── */
      .ticker {
        display: flex;
        gap: 0;
        overflow-x: auto;
        border-bottom: 1px solid var(--line);
        background: var(--panel);
        scrollbar-width: none;
      }
      .ticker::-webkit-scrollbar { display: none; }
      .tick {
        flex: 0 0 auto;
        padding: 8px 14px;
        border-right: 1px solid var(--line-soft);
        cursor: pointer;
        white-space: nowrap;
      }
      .tick.active { background: var(--panel-2); box-shadow: 0 -2px 0 var(--accent) inset; }
      .tick .t-code { color: var(--text-2); font-size: 11px; font-weight: 700; letter-spacing: 1px; }
      .tick .t-price { margin-left: 6px; color: var(--text); font-size: 12px; font-weight: 600; }
      .tick .t-chg { margin-left: 6px; font-size: 11px; }
      .up { color: var(--up); }
      .down { color: var(--down); }
      .flat { color: var(--muted); }

      main { display: grid; gap: 10px; padding: 10px; }

      .panel {
        border: 1px solid var(--line);
        border-radius: 6px;
        background: var(--panel);
      }

      /* ── Hero ─────────────────────── */
      .hero { padding: 16px 16px 14px; }
      .hero-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
      }
      .hero-id { display: flex; align-items: baseline; gap: 10px; }
      .hero-code { font-size: 22px; font-weight: 800; letter-spacing: 1.5px; }
      .hero-name { color: var(--muted); font-size: 12px; }
      .hero-contract {
        padding: 2px 8px;
        border: 1px solid var(--line);
        border-radius: 3px;
        color: var(--accent-dim);
        font-size: 11px;
      }
      .live-tag {
        margin-left: 6px;
        padding: 2px 6px;
        border-radius: 3px;
        font-size: 9px;
        font-weight: 700;
        letter-spacing: 1px;
      }
      .live-tag.on {
        background: rgba(240, 69, 92, 0.15);
        color: var(--up);
        animation: pulse 1.6s ease-in-out infinite;
      }
      .live-tag.off {
        background: var(--panel-2);
        color: var(--muted);
      }
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.45; }
      }
      @keyframes flash {
        0% { color: var(--accent); }
        100% { color: var(--text); }
      }
      .hero-price.flash { animation: flash 0.7s ease-out; }
      .quote-note {
        margin-top: 8px;
        color: var(--muted);
        font-size: 10px;
      }
      .profile-note {
        margin-top: 6px;
        color: var(--muted);
        font-size: 10px;
        line-height: 1.5;
      }
      .rank-track {
        margin-top: 6px;
        height: 8px;
        border-radius: 4px;
        background: rgba(13, 191, 126, 0.45);
        overflow: hidden;
      }
      .rank-long {
        height: 100%;
        border-radius: 4px 0 0 4px;
        background: rgba(240, 69, 92, 0.75);
      }
      .hero-price-row {
        display: flex;
        align-items: flex-end;
        gap: 12px;
        margin-top: 10px;
      }
      .hero-price {
        font-size: 44px;
        font-weight: 800;
        line-height: 1;
        letter-spacing: 0.5px;
      }
      .hero-chg {
        margin-bottom: 5px;
        padding: 3px 8px;
        border-radius: 3px;
        font-size: 13px;
        font-weight: 700;
      }
      .hero-chg.up { background: rgba(240, 69, 92, 0.14); }
      .hero-chg.down { background: rgba(13, 191, 126, 0.12); }
      .stat-grid {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 1px;
        margin-top: 16px;
        border: 1px solid var(--line-soft);
        border-radius: 5px;
        overflow: hidden;
        background: var(--line-soft);
      }
      .stat {
        padding: 9px 10px;
        background: var(--panel-2);
      }
      .stat .s-label { display: block; color: var(--muted); font-size: 10px; }
      .stat .s-value { display: block; margin-top: 4px; color: var(--text); font-size: 14px; font-weight: 700; }
      .stat .s-sub { display: block; margin-top: 2px; font-size: 10px; }

      /* ── 基差分位条 ─────────────────── */
      .pctile { margin-top: 14px; }
      .pctile-head {
        display: flex;
        justify-content: space-between;
        color: var(--muted);
        font-size: 10px;
      }
      .pctile-head .p-zone { font-weight: 700; }
      .pctile-track {
        position: relative;
        height: 6px;
        margin-top: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, #14362b 0%, #1a2130 35%, #1a2130 65%, #3a2030 100%);
      }
      .pctile-marker {
        position: absolute;
        top: -3px;
        width: 2px;
        height: 12px;
        border-radius: 1px;
        background: var(--accent);
        box-shadow: 0 0 6px rgba(79, 143, 247, 0.8);
      }
      .pctile-note { margin-top: 6px; color: var(--muted); font-size: 10px; }

      /* ── 图表 ─────────────────────── */
      .chart-panel { padding: 12px 10px 8px; }
      .chart-head {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        padding: 0 6px 8px;
      }
      .chart-title { color: var(--text-2); font-size: 12px; font-weight: 700; }
      .legend { display: flex; gap: 12px; color: var(--muted); font-size: 10px; }
      .legend i {
        display: inline-block;
        width: 8px;
        height: 2px;
        margin-right: 4px;
        vertical-align: middle;
      }
      canvas { display: block; width: 100%; height: 220px; }

      /* ── 品种表 ────────────────────── */
      .board { overflow: hidden; }
      .board-row {
        display: grid;
        grid-template-columns: 1.05fr 1fr 0.85fr 1.05fr;
        align-items: center;
        padding: 10px 12px;
        border-top: 1px solid var(--line-soft);
        cursor: pointer;
      }
      .board-row.head {
        padding: 8px 12px;
        border-top: 0;
        color: var(--muted);
        font-size: 10px;
        letter-spacing: 1px;
      }
      .board-row:not(.head):hover { background: var(--panel-2); }
      .board-row.active { background: var(--panel-2); box-shadow: 2px 0 0 var(--accent) inset; }
      .board-row > span {
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .b-code { font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .b-name { display: block; color: var(--muted); font-size: 9px; font-weight: 400; letter-spacing: 0; }
      .b-price, .b-chg, .b-basis { font-size: 12px; font-weight: 600; text-align: right; }
      .b-basis .b-zone { display: block; font-size: 9px; font-weight: 400; color: var(--muted); }

      /* ── 四维分析 ───────────────────── */
      .analysis { padding: 14px; }
      .section-title { margin: 0 0 10px; font-size: 13px; font-weight: 700; }
      .tabs {
        display: flex;
        gap: 2px;
        border-bottom: 1px solid var(--line);
      }
      .tab {
        padding: 7px 12px;
        border: 0;
        border-bottom: 2px solid transparent;
        background: transparent;
        color: var(--muted);
        font-size: 12px;
        cursor: pointer;
      }
      .tab.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
      .tab-body {
        min-height: 110px;
        padding: 12px 2px 4px;
        color: var(--text-2);
        font-size: 12px;
        line-height: 1.75;
        white-space: pre-wrap;
      }
      .conclusion {
        margin-top: 10px;
        padding: 10px 12px;
        border-left: 3px solid var(--accent);
        border-radius: 0 4px 4px 0;
        background: var(--panel-2);
        color: var(--text);
        font-size: 12px;
        font-weight: 600;
        line-height: 1.6;
      }

      /* ── 摘要/页脚 ───────────────────── */
      .summary { padding: 14px; }
      .summary-text {
        margin: 0;
        color: var(--text-2);
        font-size: 12px;
        line-height: 1.8;
        white-space: pre-wrap;
      }
      .report-entry {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 11px 14px;
      }
      .report-entry .r-title {
        overflow: hidden;
        color: var(--text-2);
        font-size: 12px;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .report-entry .r-link { flex: 0 0 auto; color: var(--accent); font-size: 11px; font-weight: 700; }
      .disclaimer {
        margin: 0;
        padding: 2px 0 14px;
        color: var(--muted);
        font-size: 10px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div class="brand">
          <h1>期现分析</h1>
          <span class="session" id="sessionText">日报</span>
        </div>
        <button class="refresh" id="refreshBtn">刷新</button>
      </header>

      <nav class="ticker" id="ticker"></nav>

      <main>
        <!-- Hero：选中品种 -->
        <section class="panel hero">
          <div class="hero-head">
            <div class="hero-id">
              <span class="hero-code" id="heroCode">PTA</span>
              <span class="hero-name" id="heroName">PTA</span>
            </div>
            <span class="hero-contract" id="heroContract">主力 TA0</span>
            <span class="live-tag off" id="liveTag">已收盘</span>
          </div>
          <div class="hero-price-row">
            <span class="hero-price num" id="heroPrice">-</span>
            <span class="hero-chg num flat" id="heroChg">-</span>
          </div>
          <div class="quote-note" id="quoteNote">已收盘 · 显示最近交易日收盘数据</div>
          <div class="stat-grid">
            <div class="stat">
              <span class="s-label">现货</span>
              <span class="s-value num" id="statSpot">-</span>
              <span class="s-sub num" id="statSpotChg">-</span>
            </div>
            <div class="stat">
              <span class="s-label">基差</span>
              <span class="s-value num" id="statBasis">-</span>
              <span class="s-sub" id="statBasisLabel">-</span>
            </div>
            <div class="stat">
              <span class="s-label">持仓量</span>
              <span class="s-value num" id="statOi">-</span>
              <span class="s-sub num" id="statOiChg">-</span>
            </div>
            <div class="stat">
              <span class="s-label">成交量</span>
              <span class="s-value num" id="statVol">-</span>
              <span class="s-sub">手</span>
            </div>
          </div>
          <div class="pctile" id="pctileBox" style="display:none">
            <div class="pctile-head">
              <span>基差分位（近一年）</span>
              <span class="p-zone" id="pctileZone">-</span>
            </div>
            <div class="pctile-track"><div class="pctile-marker" id="pctileMarker"></div></div>
            <div class="pctile-note" id="pctileNote"></div>
          </div>
          <div class="pctile" id="volBox" style="display:none">
            <div class="pctile-head">
              <span>波动率分位（近一年）</span>
              <span class="p-zone" id="volZone">-</span>
            </div>
            <div class="pctile-track"><div class="pctile-marker" id="volMarker"></div></div>
            <div class="pctile-note" id="volNote"></div>
          </div>
          <div class="pctile" id="rankBox" style="display:none">
            <div class="pctile-head">
              <span>主力持仓（前20会员）</span>
              <span class="p-zone" id="rankZone">-</span>
            </div>
            <div class="rank-track"><div class="rank-long" id="rankLongBar"></div></div>
            <div class="pctile-note" id="rankNote"></div>
          </div>
        </section>

        <!-- 图表 -->
        <section class="panel chart-panel">
          <div class="chart-head">
            <span class="chart-title" id="chartTitle">PTA 期现价格 · 近30交易日</span>
            <span class="legend">
              <span><i style="background:#4f8ff7"></i>期货</span>
              <span><i style="background:#f97316"></i>现货</span>
            </span>
          </div>
          <canvas id="trendChart"></canvas>
          <div class="profile-note" id="profileNote" style="display:none"></div>
        </section>

        <!-- 品种表 -->
        <section class="panel board" id="board"></section>

        <!-- 四维分析 -->
        <section class="panel analysis">
          <h2 class="section-title">四维分析 · <span id="analysisCode">PTA</span></h2>
          <div class="tabs" id="tabs"></div>
          <div class="tab-body" id="tabBody">加载中…</div>
          <div class="conclusion" id="conclusion" style="display:none"></div>
        </section>

        <!-- 日报入口 + 摘要 -->
        <section class="panel report-entry">
          <span class="r-title" id="reportTitle">暂无日报</span>
          <span class="r-link">已发布</span>
        </section>
        <section class="panel summary">
          <h2 class="section-title">行情摘要</h2>
          <p class="summary-text" id="summaryText">-</p>
        </section>

        <p class="disclaimer">结构描述，非买卖指令 · 数据来源：交易所行情/公开现货基准</p>
      </main>
    </div>

    <script type="module">
      const API_BASE = window.location.origin
      const fallback = {
        latest_report: {
          id: 1,
          report_date: '2026-09-24',
          session_name: 'evening',
          title: '2026-09-24 多品种期现晚报',
          market_summary: 'PTA：主力合约TA0，期货6340，现货7147.5，基差807.5（现货升水）。'
        },
        products: [
          ['PTA', 'PTA', 6340, 7147.5, 807.5, 3.59, 2.85, 1.28],
          ['PVC', 'PVC', 4798, 4665, -133, 0.59, -0.21, -1.02],
          ['LLDPE', '线型低密度聚乙烯', 8235, 9191.67, 956.67, 0.42, 0.31, 0.66],
          ['PP', '聚丙烯', 8631, 9883.33, 1252.33, 1.02, 0.52, 2.2],
          ['OCT', '辛醇', null, 8200, null, null, 0.12, null]
        ].map(([code, name, futures_close, spot_price, basis_value, futures_change_pct, spot_change_pct, open_interest_change_pct]) => ({
          code, name,
          futures_contract: { PTA: 'TA0', PVC: 'V0', LLDPE: 'L0', PP: 'PP0', OCT: null }[code],
          futures_close, spot_price, basis_value, futures_change_pct, spot_change_pct, open_interest_change_pct
        }))
      }

      const state = { code: 'PTA', tab: 'price_behavior', overview: null, trend: [], live: {}, liveOn: false, profile: null }

      const $ = (sel) => document.querySelector(sel)
      const money = (v) => (v === null || v === undefined ? '-' : Number(v).toLocaleString())
      const pct = (v) => {
        if (v === null || v === undefined) return '-'
        return `${Number(v) > 0 ? '+' : ''}${Number(v).toFixed(2)}%`
      }
      const signed = (v) => (v === null || v === undefined ? '-' : Number(v) > 0 ? `+${v}` : String(v))
      const tone = (v) => (Number(v) > 0 ? 'up' : Number(v) < 0 ? 'down' : 'flat')
      const wan = (v) => {
        if (v === null || v === undefined) return '-'
        const n = Number(v)
        return Math.abs(n) >= 100000 ? `${(n / 10000).toLocaleString('zh-CN', { maximumFractionDigits: 1 })}万` : n.toLocaleString()
      }

      /* ── 盘中准实时（档1：10s 轮询，交易时段才启动） ── */
      function isTradingNow() {
        const now = new Date()
        const day = now.getDay()
        if (day === 0 || day === 6) return false
        const hm = now.getHours() * 100 + now.getMinutes()
        return (hm >= 900 && hm <= 1015) || (hm >= 1030 && hm <= 1130) || (hm >= 1330 && hm <= 1500) || (hm >= 2100 && hm <= 2330)
      }

      // 展示口径：有 live 用 live（price/change_pct 基准=昨收），否则回落库内日线
      function displayQuote(item) {
        const live = state.live[item.code]
        if (live && live.price !== null && live.price !== undefined) {
          return { price: live.price, chg: live.change_pct, isLive: true }
        }
        const price = item.futures_close ?? item.spot_price
        const chg = item.futures_close != null ? item.futures_change_pct : item.spot_change_pct
        return { price, chg, isLive: false }
      }

      let liveTimer = null
      let liveWatch = null

      function updateLiveTag() {
        const tag = $('#liveTag')
        const note = $('#quoteNote')
        if (state.liveOn) {
          tag.textContent = 'LIVE'
          tag.className = 'live-tag on'
          note.textContent = '盘中快照 · 延迟约10秒 · 等待首次更新'
        } else {
          tag.textContent = '已收盘'
          tag.className = 'live-tag off'
          note.textContent = '已收盘 · 显示最近交易日收盘数据'
        }
      }

      async function pollRealtime() {
        const quotes = await getJson('/api/public/realtime', null)
        if (!Array.isArray(quotes)) return
        const prev = { ...state.live }
        state.live = Object.fromEntries(quotes.map((q) => [q.code, q]))
        const now = new Date()
        const hhmmss = [now.getHours(), now.getMinutes(), now.getSeconds()].map((n) => String(n).padStart(2, '0')).join(':')
        $('#quoteNote').textContent = `盘中快照 · 延迟约10秒 · 更新于 ${hhmmss}`
        const products = state.overview?.products || []
        renderTicker(products)
        renderBoard(products)
        const current = products.find((p) => p.code === state.code)
        if (current) {
          const before = prev[state.code]?.price
          const after = state.live[state.code]?.price
          renderHero(current)
          if (before !== after && after !== null && after !== undefined) {
            const el = $('#heroPrice')
            el.classList.remove('flash')
            void el.offsetWidth
            el.classList.add('flash')
          }
        }
      }

      function startRealtimeLoop() {
        const on = isTradingNow()
        state.liveOn = on
        updateLiveTag()
        if (on && !liveTimer) {
          pollRealtime()
          liveTimer = setInterval(pollRealtime, 10000)
        }
        if (!on && liveTimer) {
          clearInterval(liveTimer)
          liveTimer = null
        }
        // 跨时段守候：每分钟重估一次（收盘停轮询、夜盘开盘自动恢复）
        if (!liveWatch) {
          liveWatch = setInterval(startRealtimeLoop, 60000)
        }
      }

      async function getJson(path, fallbackValue) {
        try {
          const response = await fetch(`${API_BASE}${path}`)
          if (!response.ok) throw new Error(String(response.status))
          return await response.json()
        } catch (error) {
          return fallbackValue
        }
      }

      const TABS = [
        ['price_behavior', '价格行为'],
        ['fundamentals', '基本面'],
        ['macro', '宏观面'],
        ['policy', '政策面']
      ]

      /* ── Ticker ── */
      function renderTicker(products) {
        $('#ticker').innerHTML = products
          .map((item) => {
            const q = displayQuote(item)
            return `<div class="tick ${item.code === state.code ? 'active' : ''}" data-code="${item.code}">
              <span class="t-code">${item.code}</span><span class="t-price num">${money(q.price)}</span><span class="t-chg num ${tone(q.chg)}">${pct(q.chg)}</span>
            </div>`
          })
          .join('')
        document.querySelectorAll('.tick').forEach((el) => {
          el.addEventListener('click', () => selectProduct(el.dataset.code))
        })
      }

      /* ── 品种表 ── */
      function renderBoard(products) {
        const rows = products
          .map((item) => {
            const q = displayQuote(item)
            const basisZone =
              item.basis_value == null ? '' : item.basis_value > 10 ? '升水' : item.basis_value < -10 ? '贴水' : '平水'
            return `<div class="board-row ${item.code === state.code ? 'active' : ''}" data-code="${item.code}">
              <span class="b-code">${item.code}<span class="b-name">${item.name}</span></span>
              <span class="b-price num">${money(q.price)}</span>
              <span class="b-chg num ${tone(q.chg)}">${pct(q.chg)}</span>
              <span class="b-basis num">${item.basis_value == null ? '现货' : signed(item.basis_value)}<span class="b-zone">${basisZone}</span></span>
            </div>`
          })
          .join('')
        $('#board').innerHTML = `<div class="board-row head"><span>品种</span><span style="text-align:right">最新价</span><span style="text-align:right">涨跌</span><span style="text-align:right">基差</span></div>${rows}`
        document.querySelectorAll('.board-row:not(.head)').forEach((el) => {
          el.addEventListener('click', () => selectProduct(el.dataset.code))
        })
      }

      /* ── Hero ── */
      function renderHero(item) {
        if (!item) return
        const q = displayQuote(item)
        const hasFutures = item.futures_close != null || state.live[item.code]?.price != null
        $('#heroCode').textContent = item.code
        $('#heroName').textContent = item.name
        const liveContract = state.live[item.code]?.contract_code
        $('#heroContract').textContent = hasFutures ? `主力 ${liveContract || item.futures_contract || '-'}` : '现货品种'
        $('#heroPrice').textContent = money(q.price)
        const chgEl = $('#heroChg')
        chgEl.textContent = pct(q.chg)
        chgEl.className = `hero-chg num ${tone(q.chg)}`
        $('#statSpot').textContent = money(item.spot_price)
        const spotChgEl = $('#statSpotChg')
        spotChgEl.textContent = pct(item.spot_change_pct)
        spotChgEl.className = `s-sub num ${tone(item.spot_change_pct)}`
        $('#statBasis').textContent = item.basis_value == null ? '-' : signed(item.basis_value)
        $('#statBasisLabel').textContent =
          item.basis_value == null ? '无基差' : item.basis_value > 10 ? '现货升水' : item.basis_value < -10 ? '现货贴水' : '平水'
        const last = state.trend[state.trend.length - 1] || {}
        const live = state.live[item.code]
        $('#statOi').textContent = wan(live?.open_interest ?? last.open_interest)
        const oiChgEl = $('#statOiChg')
        oiChgEl.textContent = pct(item.open_interest_change_pct)
        oiChgEl.className = `s-sub num ${tone(item.open_interest_change_pct)}`
        $('#statVol').textContent = wan(live?.volume ?? last.volume)
      }

      /* ── 基差分位 ── */
      async function renderPctile(code) {
        const box = $('#pctileBox')
        const data = await getJson(`/api/public/basis/${code}`, null)
        const snap = data?.snapshot
        if (!snap || snap.percentile === null || snap.percentile === undefined) {
          box.style.display = 'none'
          return
        }
        box.style.display = 'block'
        $('#pctileZone').textContent = `${snap.zone || '-'} · ${snap.percentile}%`
        $('#pctileMarker').style.left = `calc(${Math.min(Math.max(snap.percentile, 0), 100)}% - 1px)`
        $('#pctileNote').textContent =
          `当前基差 ${signed(snap.basis_value)}（${snap.basis_label}），高于近一年 ${snap.percentile}% 的交易日` +
          `（样本 ${snap.sample_days} 天${snap.data_stale ? '，数据停更' : ''}）`
      }

      /* ── 波动率分位（期权传感器，V1 仅 PTA，无数据自动隐藏）── */
      async function renderVol(code) {
        const box = $('#volBox')
        const snap = await getJson(`/api/public/volatility/${code}`, null)
        if (!snap || snap.iv_percentile === null || snap.iv_percentile === undefined) {
          box.style.display = 'none'
          return
        }
        box.style.display = 'block'
        $('#volZone').textContent = `${snap.zone || '-'} · ${snap.iv_percentile}%`
        $('#volMarker').style.left = `calc(${Math.min(Math.max(snap.iv_percentile, 0), 100)}% - 1px)`
        const spread = snap.iv_hv_spread == null ? '' : `，IV-HV 利差 ${snap.iv_hv_spread > 0 ? '+' : ''}${snap.iv_hv_spread}`
        $('#volNote').textContent =
          `平值隐含波动率 ${snap.atm_iv}%（标的 ${snap.underlying_month}），高于近一年 ${snap.iv_percentile}% 的交易日` +
          `；20 日历史波动率 ${snap.hv20 == null ? '-' : snap.hv20 + '%'}${spread}（样本 ${snap.sample_days} 天）`
      }

      /* ── 四维分析 ── */
      function renderAnalysis() {
        const report = state.overview?.latest_report || {}
        const analyses = Array.isArray(report.product_analyses) ? report.product_analyses : []
        const item = analyses.find((a) => a.product_code === state.code) || {}
        $('#analysisCode').textContent = state.code
        $('#tabs').innerHTML = TABS.map(
          ([key, label]) => `<button class="tab ${state.tab === key ? 'active' : ''}" data-tab="${key}">${label}</button>`
        ).join('')
        document.querySelectorAll('.tab').forEach((el) => {
          el.addEventListener('click', () => {
            state.tab = el.dataset.tab
            renderAnalysis()
          })
        })
        $('#tabBody').textContent = item[state.tab] || '本期报告未覆盖该维度'
        const conclusionEl = $('#conclusion')
        if (item.conclusion) {
          conclusionEl.style.display = 'block'
          conclusionEl.textContent = item.conclusion
        } else {
          conclusionEl.style.display = 'none'
        }
      }

      /* ── 图表 ── */
      function drawTrend(points) {
        const canvas = $('#trendChart')
        const dpr = window.devicePixelRatio || 1
        const cssW = canvas.clientWidth
        const cssH = canvas.clientHeight
        canvas.width = cssW * dpr
        canvas.height = cssH * dpr
        const ctx = canvas.getContext('2d')
        ctx.scale(dpr, dpr)
        const W = cssW
        const H = cssH
        const area = { x: 8, y: 12, w: W - 58, h: H - 34 }

        ctx.clearRect(0, 0, W, H)
        ctx.fillStyle = '#111627'
        ctx.fillRect(0, 0, W, H)

        const series = [
          { key: 'futures_close', color: '#4f8ff7', fill: true },
          { key: 'spot_price', color: '#f97316', fill: false }
        ]
        const allValues = points.flatMap((p) => [p.futures_close, p.spot_price]).filter((v) => Number.isFinite(Number(v))).map(Number)
        if (!points.length || !allValues.length) {
          ctx.fillStyle = '#5d6779'
          ctx.font = '12px sans-serif'
          ctx.fillText('暂无趋势数据', W / 2 - 36, H / 2)
          return
        }
        let min = Math.min(...allValues)
        let max = Math.max(...allValues)
        const pad = (max - min) * 0.08 || max * 0.01 || 1
        min -= pad
        max += pad

        // 网格 + Y 轴价格标签
        ctx.strokeStyle = '#1f2637'
        ctx.fillStyle = '#5d6779'
        ctx.lineWidth = 1
        ctx.font = '10px sans-serif'
        for (let i = 0; i <= 4; i += 1) {
          const y = area.y + (area.h / 4) * i
          ctx.beginPath()
          ctx.moveTo(area.x, y)
          ctx.lineTo(area.x + area.w, y)
          ctx.stroke()
          const value = max - ((max - min) / 4) * i
          ctx.fillText(value >= 10000 ? (value / 1000).toFixed(1) + 'k' : String(Math.round(value)), area.x + area.w + 6, y + 3)
        }

        const xAt = (i) => area.x + (i / Math.max(points.length - 1, 1)) * area.w
        const yAt = (v) => area.y + area.h - ((Number(v) - min) / (max - min)) * area.h

        for (const s of series) {
          const vals = points.map((p) => Number(p[s.key])).filter(Number.isFinite)
          if (vals.length < 2) continue
          if (s.fill) {
            const gradient = ctx.createLinearGradient(0, area.y, 0, area.y + area.h)
            gradient.addColorStop(0, 'rgba(79,143,247,0.28)')
            gradient.addColorStop(1, 'rgba(79,143,247,0)')
            ctx.beginPath()
            points.forEach((p, i) => {
              const x = xAt(i)
              const y = yAt(p[s.key])
              if (i === 0) ctx.moveTo(x, y)
              else ctx.lineTo(x, y)
            })
            ctx.lineTo(xAt(points.length - 1), area.y + area.h)
            ctx.lineTo(xAt(0), area.y + area.h)
            ctx.closePath()
            ctx.fillStyle = gradient
            ctx.fill()
          }
          ctx.beginPath()
          points.forEach((p, i) => {
            const x = xAt(i)
            const y = yAt(p[s.key])
            if (i === 0) ctx.moveTo(x, y)
            else ctx.lineTo(x, y)
          })
          ctx.strokeStyle = s.color
          ctx.lineWidth = s.fill ? 2 : 1.5
          ctx.stroke()

          // 末点标记 + 最新价虚线
          const lastIdx = points.length - 1
          const lastY = yAt(points[lastIdx][s.key])
          ctx.beginPath()
          ctx.arc(xAt(lastIdx), lastY, 3, 0, Math.PI * 2)
          ctx.fillStyle = s.color
          ctx.fill()
          ctx.setLineDash([3, 3])
          ctx.beginPath()
          ctx.moveTo(area.x, lastY)
          ctx.lineTo(area.x + area.w, lastY)
          ctx.strokeStyle = s.color + '55'
          ctx.lineWidth = 1
          ctx.stroke()
          ctx.setLineDash([])
        }

        /* ── 成交量分布叠加（近5日分钟线，右锚横条）── */
        const prof = state.profile
        if (prof && Array.isArray(prof.bins) && prof.bins.length) {
          const barMaxW = area.w * 0.22
          const maxVol = prof.max_bin_volume || 1
          for (const b of prof.bins) {
            const y = yAt(b.price)
            if (y < area.y || y > area.y + area.h) continue
            const bh = Math.max(((prof.bin_size || 1) / (max - min)) * area.h * 0.9, 2)
            const bw = (b.volume / maxVol) * barMaxW
            ctx.fillStyle = b.is_poc ? 'rgba(79,143,247,0.42)' : 'rgba(79,143,247,0.16)'
            ctx.fillRect(area.x + area.w - bw, y - bh / 2, bw, bh)
            if (b.big_volume > 0) {
              const bw2 = (b.big_volume / maxVol) * barMaxW
              ctx.fillStyle = 'rgba(232,179,74,0.5)'
              ctx.fillRect(area.x + area.w - bw2, y - bh / 2, bw2, bh)
            }
          }
          // POC / VAH / VAL 参考线
          const refLines = [
            [prof.poc, '#4f8ff7', 'POC'],
            [prof.vah, '#5d6779', 'VAH'],
            [prof.val, '#5d6779', 'VAL']
          ]
          ctx.font = '9px sans-serif'
          for (const [price, color, label] of refLines) {
            if (!Number.isFinite(Number(price))) continue
            const y = yAt(price)
            if (y < area.y || y > area.y + area.h) continue
            ctx.setLineDash([4, 4])
            ctx.beginPath()
            ctx.moveTo(area.x, y)
            ctx.lineTo(area.x + area.w, y)
            ctx.strokeStyle = color + (label === 'POC' ? 'aa' : '66')
            ctx.lineWidth = 1
            ctx.stroke()
            ctx.setLineDash([])
            ctx.fillStyle = color
            ctx.fillText(label, area.x + 2, y - 3)
          }
        }

        // 日期标签
        ctx.fillStyle = '#5d6779'
        ctx.font = '10px sans-serif'
        ctx.fillText(String(points[0]?.trade_date || '').slice(5), area.x, H - 8)
        const lastDate = String(points[points.length - 1]?.trade_date || '').slice(5)
        ctx.fillText(lastDate, area.x + area.w - ctx.measureText(lastDate).width, H - 8)
      }

      /* ── 数据流 ── */
      async function selectProduct(code) {
        state.code = code
        const products = state.overview?.products || []
        renderTicker(products)
        renderBoard(products)
        await loadTrend()
        renderHero(products.find((p) => p.code === code))
        renderPctile(code)
        renderVol(code)
        renderProfile(code)
        renderRank(code)
        renderAnalysis()
      }

      async function loadTrend() {
        $('#chartTitle').textContent = `${state.code} 期现价格 · 近30交易日`
        const trend = await getJson(`/api/public/products/${state.code}/trend?days=60`, [])
        state.trend = trend
        drawTrend(trend.slice(-30))
      }

      /* ── 成交量分布（订单流免费近似，近5日分钟线）── */
      async function renderProfile(code) {
        const note = $('#profileNote')
        const prof = await getJson(`/api/public/volume-profile/${code}`, null)
        state.profile = prof
        if (!prof || !Array.isArray(prof.bins) || !prof.bins.length) {
          note.style.display = 'none'
          if (state.trend.length) drawTrend(state.trend.slice(-30))
          return
        }
        note.style.display = 'block'
        const span = `${fmtPrice(prof.val)}-${fmtPrice(prof.vah)}`
        const winTxt = `${String(prof.window_start || '').slice(5, 10)}→${String(prof.window_end || '').slice(5, 10)}`
        note.textContent =
          `近5日密集成交区 ${span} · POC ${fmtPrice(prof.poc)} · 现价${prof.position || '-'}` +
          ` · 放量成交占比 ${prof.big_volume_pct}%（${winTxt}，橙色=放量分钟）`
        if (state.trend.length) drawTrend(state.trend.slice(-30))
      }

      function fmtPrice(v) {
        return Number.isFinite(Number(v)) ? String(Math.round(Number(v))) : '-'
      }

      /* ── 主力持仓（前20会员，大资金方向，日频官方）── */
      function lots(v) {
        return Number.isFinite(Number(v)) ? (Number(v) / 10000).toFixed(1) : '-'
      }
      function signedLots(v) {
        if (!Number.isFinite(Number(v))) return '-'
        const w = Number(v) / 10000
        return (w > 0 ? '+' : '') + w.toFixed(1)
      }
      async function renderRank(code) {
        const box = $('#rankBox')
        const snap = await getJson(`/api/public/position-rank/${code}`, null)
        if (!snap || snap.net_long === null || snap.net_long === undefined) {
          box.style.display = 'none'
          return
        }
        box.style.display = 'block'
        const net = snap.net_long
        $('#rankZone').textContent = `${net >= 0 ? '净多' : '净空'} ${lots(Math.abs(net))}万手 · 分位 ${snap.net_percentile}%`
        $('#rankLongBar').style.width = `${Math.min(Math.max(snap.long_pct || 50, 0), 100)}%`
        $('#rankNote').textContent =
          `多头 ${lots(snap.long_top20)}万手（${signedLots(snap.long_chg_top20)}）· 空头 ${lots(snap.short_top20)}万手（${signedLots(snap.short_chg_top20)}）` +
          `，净${net >= 0 ? '多' : '空'}较上日 ${signedLots(snap.net_chg)}万手（近${snap.sample_days}日样本，红=多绿=空）`
      }

      async function load() {
        const data = await getJson('/api/public/overview', fallback)
        state.overview = data
        if (!data.products?.some((item) => item.code === state.code)) {
          state.code = data.products?.[0]?.code || 'PTA'
        }
        $('#sessionText').textContent =
          (data.latest_report?.session_name === 'morning' ? '早报' : '晚报') +
          ' · ' +
          String(data.latest_report?.report_date || '').slice(5)
        $('#reportTitle').textContent = data.latest_report?.title || '暂无日报'
        $('#summaryText').textContent = data.latest_report?.market_summary || '-'
        await selectProduct(state.code)
        startRealtimeLoop()
      }

      $('#refreshBtn').addEventListener('click', load)
      window.addEventListener('resize', () => drawTrend(state.trend.slice(-30)))
      // 调试句柄：验收脚本/控制台排障用（只读引用，不暴露写接口）
      window.__terminal = { state, renderHero, renderTicker, renderBoard, updateLiveTag, pollRealtime }
      load()
    </script>
  </body>
</html>
