<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>期现分析</title>
    <style>
      :root {
        color: #e6eaf2;
        background: #0b0e17;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", "Microsoft YaHei", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #0b0e17;
      }

      .app {
        width: min(100%, 430px);
        min-height: 100vh;
        margin: 0 auto;
        background: #0b0e17;
      }

      .num {
        font-variant-numeric: tabular-nums;
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 20px;
        border-bottom: 1px solid #1f2637;
        background: #0d1322;
        color: #e6eaf2;
      }

      .eyebrow {
        margin: 0 0 5px;
        color: #7ea8f0;
        font-size: 12px;
      }

      h1 {
        margin: 0;
        font-size: 24px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .refresh {
        width: 60px;
        height: 32px;
        border: 1px solid #4f8ff7;
        border-radius: 5px;
        background: transparent;
        color: #4f8ff7;
        font-size: 12px;
        font-weight: 700;
      }

      main {
        display: grid;
        gap: 12px;
        padding: 12px;
      }

      .panel {
        border: 1px solid #1f2637;
        border-radius: 6px;
        background: #131826;
      }

      .report {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 14px;
        padding: 14px 16px;
      }

      .report h2 {
        margin: 0;
        overflow: hidden;
        color: #e6eaf2;
        font-size: 16px;
        font-weight: 600;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .report p {
        margin: 5px 0 0;
        color: #5d6779;
        font-size: 12px;
      }

      .link {
        flex: 0 0 auto;
        color: #4f8ff7;
        font-size: 12px;
        font-weight: 700;
      }

      .product-list {
        display: grid;
        gap: 10px;
      }

      .product {
        padding: 14px 16px;
      }

      .product.active {
        border-color: #4f8ff7;
        box-shadow: 0 0 0 1px #4f8ff7 inset;
      }

      .product-head,
      .price-row {
        display: flex;
        align-items: flex-start;
        justify-content: space-between;
        gap: 12px;
      }

      .code {
        display: inline-block;
        margin: 0;
        color: #e6eaf2;
        font-size: 22px;
        font-weight: 700;
        letter-spacing: 1px;
      }

      .name {
        margin: 2px 0 0;
        color: #5d6779;
        font-size: 12px;
      }

      .main-contract {
        color: #7ea8f0;
        font-weight: 400;
        font-variant-numeric: tabular-nums;
      }

      .price-row {
        margin-top: 14px;
      }

      .label {
        display: block;
        color: #5d6779;
        font-size: 11px;
      }

      .value {
        display: block;
        margin-top: 4px;
        color: #e6eaf2;
        font-size: 20px;
        font-weight: 700;
        font-variant-numeric: tabular-nums;
      }

      .change {
        display: block;
        margin-top: 2px;
        color: #7d879c;
        font-size: 12px;
        font-variant-numeric: tabular-nums;
      }

      .positive {
        color: #f0455c;
      }

      .negative {
        color: #0dbf7e;
      }

      .basis-row {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }

      .basis-row span {
        padding: 4px 9px;
        border: 1px solid #232b3d;
        border-radius: 4px;
        background: #1a2130;
        color: #a7b0c2;
        font-size: 11px;
        font-variant-numeric: tabular-nums;
      }

      .chart-panel,
      .summary,
      .analysis {
        padding: 14px 16px;
      }

      .section-title {
        margin: 0 0 10px;
        color: #e6eaf2;
        font-size: 15px;
        font-weight: 600;
      }

      canvas {
        width: 100%;
        height: 210px;
      }

      .summary-text {
        margin: 0;
        color: #c3cad9;
        font-size: 13px;
        line-height: 1.7;
        white-space: pre-wrap;
      }

      .analysis-grid {
        display: grid;
        gap: 10px;
      }

      .analysis-item {
        padding: 12px;
        border: 1px solid #1f2637;
        border-radius: 5px;
        background: #161d2c;
      }

      .analysis-item h3 {
        margin: 0 0 7px;
        color: #4f8ff7;
        font-size: 13px;
      }

      .conclusion-text {
        color: #f0455c;
        font-weight: 700;
      }

      .disclaimer {
        margin: 0;
        padding: 4px 0 14px;
        color: #5d6779;
        font-size: 11px;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header class="top">
        <div>
          <p class="eyebrow" id="sessionText">日报</p>
          <h1>期现分析</h1>
        </div>
        <button class="refresh" id="refreshBtn">刷新</button>
      </header>
      <main>
        <section class="report panel" id="reportCard"></section>
        <section class="product-list" id="productList"></section>
        <section class="chart-panel panel">
          <h2 class="section-title" id="chartTitle">PTA 期现价格</h2>
          <canvas id="trendChart" width="760" height="420"></canvas>
        </section>
        <section class="analysis panel">
          <h2 class="section-title">四维分析</h2>
          <div class="analysis-grid" id="analysisGrid"></div>
        </section>
        <section class="summary panel">
          <h2 class="section-title">行情摘要</h2>
          <p class="summary-text" id="summaryText"></p>
        </section>
        <p class="disclaimer">结构描述，非买卖指令</p>
      </main>
    </div>

    <script type="module">
      const API_BASE = window.location.origin
      const fallback = {
        latest_report: {
          id: 1,
          report_date: '2026-07-09',
          session_name: 'evening',
          title: '2026-07-09 PTA/PVC/塑料期现晚报',
          market_summary:
            'PTA：主力合约TA2609，期货5862，现货5910，基差48。\nPVC：主力合约V2609，期货5620，现货5580，基差-40。\nLLDPE：主力合约L2609，期货8190，现货8250，基差60。\nPP：主力合约PP2609，期货7442，现货7380，基差-62。\nOCT：现货8200，纯现货跟踪，无期货基差。',
          price_behavior_analysis:
            'PTA主力合约TA2609：期货+0.74%，现货+0.35%，持仓+1.42%，盘面资金偏强。\nPVC主力合约V2609：现货弱于盘面，短线仍需观察承接。',
          fundamentals_analysis:
            'PTA聚酯刚需仍在；PVC地产链需求恢复偏慢；LLDPE库存平稳；PP现货贴水扩大。',
          macro_analysis: '原油、煤化工成本和人民币汇率仍是塑化链条主要外部变量，当前宏观信号未形成单边共振。',
          policy_analysis:
            '关注能耗、安全生产、环保检查、地产链支持政策，以及交易所保证金和限仓调整。'
        },
        products: [
          ['PTA', 'PTA', 5862, 5910, 48, 0.74, 0.35, 1.42],
          ['PVC', 'PVC', 5620, 5580, -40, -0.52, -0.83, 0.66],
          ['LLDPE', '线型低密度聚乙烯', 8190, 8250, 60, 0.18, 0.12, -0.41],
          ['PP', '聚丙烯', 7442, 7380, -62, -0.34, -1.08, 2.2],
          ['OCT', '辛醇', null, 8200, null, null, 0.12, null]
        ].map(
          ([
            code,
            name,
            futures_close,
            spot_price,
            basis_value,
            futures_change_pct,
            spot_change_pct,
            open_interest_change_pct
          ]) => ({
            code,
            name,
            futures_contract: { PTA: 'TA2609', PVC: 'V2609', LLDPE: 'L2609', PP: 'PP2609', OCT: null }[code],
            futures_close,
            spot_price,
            basis_value,
            futures_change_pct,
            spot_change_pct,
            open_interest_change_pct
          })
        )
      }

      let selectedCode = 'PTA'

      function money(value) {
        return value === null || value === undefined ? '-' : Number(value).toLocaleString()
      }

      function pct(value) {
        if (value === null || value === undefined) return '-'
        return `${Number(value) > 0 ? '+' : ''}${Number(value).toFixed(2)}%`
      }

      function signed(value) {
        if (value === null || value === undefined) return '-'
        return Number(value) > 0 ? `+${value}` : String(value)
      }

      function tone(value) {
        if (Number(value) > 0) return 'positive'
        if (Number(value) < 0) return 'negative'
        return ''
      }

      function mockTrend(code) {
        const product = fallback.products.find((item) => item.code === code) || fallback.products[0]
        const hasFutures = product.futures_close !== null && product.futures_close !== undefined
        return Array.from({ length: 30 }, (_, index) => {
          const baseFuture = hasFutures ? product.futures_close : product.spot_price || 7000
          const baseSpot = product.spot_price
          const wave = Math.sin(index / 4) * baseFuture * 0.01
          const drift = (index - 15) * baseFuture * 0.00035
          return {
            trade_date: `2026-06-${String(10 + index).padStart(2, '0')}`,
            futures_contract: product.futures_contract,
            futures_close: hasFutures ? Math.round(baseFuture + wave + drift) : null,
            spot_price: Math.round(baseSpot + Math.cos(index / 5) * baseSpot * 0.008 + drift * 0.6)
          }
        })
      }

      async function getJson(path, fallbackValue) {
        try {
          const response = await fetch(`${API_BASE}${path}`)
          if (!response.ok) throw new Error(String(response.status))
          return await response.json()
        } catch (error) {
          return fallbackValue
        }
      }

      function getProductAnalysis(report = {}, code, products = []) {
        const analyses = Array.isArray(report.product_analyses) ? report.product_analyses : []
        const matched = analyses.find((item) => item.product_code === code)
        if (matched) return matched

        const product = products.find((item) => item.code === code) || {}
        const spotOnly = !product.futures_contract
        return {
          product_code: code,
          price_behavior: spotOnly
            ? `${code}（${product.name || '现货品种'}）为现货品种，暂不做期货盘面分析。价格行为以华东现货${money(product.spot_price)}、区域报价、库存、开工率和产业链成本传导为主。`
            : `${code}主力合约${product.futures_contract || '-'}，期货${money(product.futures_close)}，现货${money(product.spot_price)}，基差${signed(product.basis_value)}，持仓变化${pct(product.open_interest_change_pct)}。`,
          fundamentals: `${code}区域现货：华东${money(product.spot_price)}。开工率、社会库存与工厂库存详见日报；库存周期需持续跟踪。`,
          macro: `${code}宏观面重点跟踪美元兑人民币、中国经济、美国经济、原油和产业链传导。`,
          policy: `${code}每日政策/产业消息：安全生产、环保检查、装置检修动态，详见日报政策栏。`,
          conclusion: `结论：以上为 ${code} 期现结构描述，非买卖指令。`
        }
      }

      function renderAnalysis(report, code, products) {
        const analysis = getProductAnalysis(report, code, products)
        const title = document.querySelector('#analysisTitle') || document.querySelector('.analysis .section-title')
        title.textContent = `${analysis.product_code || code} 四维分析`
        const sections = [
          ['价格行为', analysis.price_behavior, false],
          ['基本面', analysis.fundamentals, false],
          ['宏观面', analysis.macro, false],
          ['政策面', analysis.policy, false],
          ['结论', analysis.conclusion, true]
        ]
        document.querySelector('#analysisGrid').innerHTML = sections
          .map(
            ([title, content, conclusion]) => `
              <article class="analysis-item">
                <h3>${title}</h3>
                <p class="summary-text ${conclusion ? 'conclusion-text' : ''}">${content || '-'}</p>
              </article>
            `
          )
          .join('')
      }

      function renderOverview(data) {
        document.querySelector('#sessionText').textContent =
          data.latest_report?.session_name === 'morning' ? '早报' : '晚报'
        document.querySelector('#reportCard').innerHTML = `
          <div>
            <h2>${data.latest_report?.title || '暂无日报'}</h2>
            <p>${data.latest_report?.report_date || ''}</p>
          </div>
          <span class="link">已发布</span>
        `
        document.querySelector('#productList').innerHTML = data.products
          .map(
            (item) => `
              <article class="product panel ${selectedCode === item.code ? 'active' : ''}" data-code="${item.code}" data-name="${item.name}">
                <div class="product-head">
                  <div>
                    <p class="code">${item.code}</p>
                    <p class="name">${item.name}</p>
                  </div>
                  <span class="name main-contract">${item.futures_contract ? `主力 ${item.futures_contract}` : '现货品种'}</span>
                </div>
                <div class="price-row">
                  <div>
                    <span class="label">${item.futures_contract ? '期货' : '期货不适用'}</span>
                    <span class="value">${money(item.futures_close)}</span>
                    <span class="change ${tone(item.futures_change_pct)}">${pct(item.futures_change_pct)}</span>
                  </div>
                  <div>
                    <span class="label">现货</span>
                    <span class="value">${money(item.spot_price)}</span>
                    <span class="change ${tone(item.spot_change_pct)}">${pct(item.spot_change_pct)}</span>
                  </div>
                </div>
                <div class="basis-row">
                  <span>${item.futures_contract ? `基差 ${signed(item.basis_value)}` : '无期货基差'}</span>
                  <span>${item.futures_contract ? `持仓 ${pct(item.open_interest_change_pct)}` : '现货跟踪'}</span>
                </div>
              </article>
            `
          )
          .join('')
        renderAnalysis(data.latest_report || {}, selectedCode, data.products || [])
        document.querySelector('#summaryText').textContent = data.latest_report?.market_summary || '-'
        document.querySelectorAll('.product').forEach((card) => {
          card.addEventListener('click', () => {
            selectedCode = card.dataset.code
            document
              .querySelectorAll('.product')
              .forEach((item) => item.classList.toggle('active', item.dataset.code === selectedCode))
            renderAnalysis(data.latest_report || {}, selectedCode, data.products || [])
            loadTrend(selectedCode, card.dataset.name)
          })
        })
      }

      function drawTrend(points) {
        const canvas = document.querySelector('#trendChart')
        const ctx = canvas.getContext('2d')
        const width = canvas.width
        const height = canvas.height
        const area = { x: 56, y: 34, w: width - 86, h: height - 78 }
        ctx.clearRect(0, 0, width, height)
        ctx.fillStyle = '#131826'
        ctx.fillRect(0, 0, width, height)
        ctx.strokeStyle = '#1f2637'
        ctx.lineWidth = 2
        for (let i = 0; i <= 4; i += 1) {
          const y = area.y + (area.h / 4) * i
          ctx.beginPath()
          ctx.moveTo(area.x, y)
          ctx.lineTo(area.x + area.w, y)
          ctx.stroke()
        }
        drawLine(points, 'futures_close', '#4f8ff7', area, ctx)
        drawLine(points, 'spot_price', '#f97316', area, ctx)
        ctx.fillStyle = '#7d879c'
        ctx.font = '22px sans-serif'
        ctx.fillText(points[0]?.trade_date?.slice(5) || '', area.x, height - 20)
        ctx.fillText(points.at(-1)?.trade_date?.slice(5) || '', width - 104, height - 20)
      }

      function drawLine(points, key, color, area, ctx) {
        const values = points.map((item) => Number(item[key])).filter(Number.isFinite)
        if (values.length < 2) return
        const min = Math.min(...values)
        const max = Math.max(...values)
        ctx.strokeStyle = color
        ctx.lineWidth = 5
        ctx.beginPath()
        points.forEach((item, index) => {
          const x = area.x + (index / Math.max(points.length - 1, 1)) * area.w
          const y = area.y + area.h - ((Number(item[key]) - min) / Math.max(max - min, 1)) * area.h
          if (index === 0) ctx.moveTo(x, y)
          else ctx.lineTo(x, y)
        })
        ctx.stroke()
      }

      async function loadTrend(code, name) {
        document.querySelector('#chartTitle').textContent = code === 'OCT' ? `${code} 现货价格趋势` : `${code} 主力合约期现价格`
        const trend = await getJson(`/api/public/products/${code}/trend?days=60`, mockTrend(code))
        drawTrend(trend.slice(-30))
      }

      async function load() {
        const data = await getJson('/api/public/overview', fallback)
        if (!data.products?.some((item) => item.code === selectedCode)) {
          selectedCode = data.products?.[0]?.code || 'PTA'
        }
        renderOverview(data)
        await loadTrend(selectedCode)
      }

      document.querySelector('#refreshBtn').addEventListener('click', load)
      load()
    </script>
  </body>
</html>
